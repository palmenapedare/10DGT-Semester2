<!-- form with input of bedrooms, land size estimate, etc etc and will output a price range-->
{% extends "layout.html" %}
{% set title = "Predictor" %}
{% block content %}

<form method="POST">
<div class="main-container display-flex">
  <div class="row" style="padding: 10px;">
    <div class="col">
    <input type="number" name="landsize" id="landsizeValue" class="form-control" placeholder="Land size">
    </div>
    <div class="col">
    <input type="number" name="bedrooms" id="bedroomsValue" class="form-control" placeholder="Number of bedrooms">
    </div>
    <div class="col">
    <input type="number" name="postcode" id="postcodeValue" class="form-control" maxlength="4" minlength="4" placeholder="Postcode">
    <p style="font-variant: small-caps;">4 characters, as Aus standard</p>
    </div>
  </div>
  <div class="row" style="padding: 10px;">
    <div class="col">
    <input type="text" name="streetname" id="streetnameValue" class="form-control" placeholder="Street Name">
    </div>
    <div class="col">
      <input type="date" name="saledate" id="saledateValue" class="form-control">
    </div>
  </div>
  <div class="row" style="padding:20px">
    <button type="submit" class="theme-info btn-subtle" style="max-width: 20%; margin-inline: auto;">Submit</button>
  </div>
  </div>
</form>
{% endblock %}
